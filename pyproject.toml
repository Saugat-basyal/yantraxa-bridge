[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yantraxa-bridge"
version = "0.1.0"
description = "Connects a locally hosted AI to Yantraxa meetings over an outbound WebSocket."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
keywords = ["ai", "agents", "meetings", "websocket"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "websockets>=14",
  "httpx>=0.27",
  "pydantic>=2.7",
  "typer>=0.12",
  "cryptography>=42",
]

[project.urls]
Homepage = "https://yantraxa.com/bridge"
Repository = "https://github.com/Saugat-basyal/yantraxa-bridge"
Issues = "https://github.com/Saugat-basyal/yantraxa-bridge/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "ruff>=0.6",
]

[project.scripts]
yantraxa-bridge = "yantraxa_bridge.cli:app"

[tool.setuptools]
packages = ["yantraxa_bridge", "yantraxa_bridge.adapters"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
